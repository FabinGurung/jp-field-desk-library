          fi


  release-project-field-v2-0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify v2.0.0 project, Field and hierarchy publication against live Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v2.0.0.md'
          tag='v2.0.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo "No v2.0.0 milestone change in this commit"
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in projects.html projects.js field.html index.html system-map.html \
            assets/css/project-guide.css assets/css/field-report.css; do
            curl -fsS --retry 7 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" | cmp - "site/$file"
          done
          for file in catalog.json document-packets.json projects-directory.json; do
            curl -fsS --retry 7 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" > "/tmp/$(basename "$file")"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path("/tmp/catalog.json").read_text())
          packets=json.loads(Path("/tmp/document-packets.json").read_text())
          directory=json.loads(Path("/tmp/projects-directory.json").read_text())
          ids=[p["project_id"] for p in directory["projects"]]
          assert source["schema_version"]=="2.0.0"
          assert len(source["resources"])==74 and len(source["projects"])==10
          assert len(packets["documents"])==6
          assert len(ids)>=29 and len(ids)==len(set(ids)) and "PRJ-000030" not in ids
          assert directory["no_documents_inferred"] is True
          assert directory["publication_method"] in (
            "AUTHENTICATED_DOUBLE_READ__CANONICAL_PROJECTS",
            "AUTHENTICATED_SOURCE_ACCESS_UNVERIFIED__DATED_FALLBACK",
            "DATED_OWNER_REVIEWED_FALLBACK"
          )
          assert source["source_manifest"]["private_payroll_connected"] is False
          assert len([x for x in source["resources"] if x["project_id"]=="JPENT-ASTAM-2026-01"])==6
          print("Resource v2.0.0 live Pages PASS: 29+ public identities, 74 independently admitted resource links, six packet PDFs, explicit project source provenance")
          PY
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library v2.0.0 — All Projects & Ordered Field Records' --notes-file "$notes"
          fi
