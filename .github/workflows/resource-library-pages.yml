name: A9 Desk Resources — Drive Link Publisher
on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'docs/releases/v1.3.0.md'
      - 'docs/releases/v1.3.2.md'
      - 'docs/releases/v1.4.0.md'
      - 'docs/releases/v1.5.0.md'
      - 'docs/releases/v1.6.0.md'
      - 'docs/releases/v1.7.0.md'
      - 'docs/releases/v1.7.1.md'
      - 'docs/releases/v1.8.0.md'
      - 'docs/releases/v1.8.1.md'
      - 'docs/releases/v1.9.0.md'
      - 'docs/releases/v2.0.0.md'
      - 'docs/governance/**'
      - 'docs/operations/**'
      - 'README.md'
      - '.github/workflows/resource-library-pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'docs/releases/v1.3.0.md'
      - 'docs/releases/v1.3.2.md'
      - 'docs/releases/v1.4.0.md'
      - 'docs/releases/v1.5.0.md'
      - 'docs/releases/v1.6.0.md'
      - 'docs/releases/v1.7.0.md'
      - 'docs/releases/v1.7.1.md'
      - 'docs/releases/v1.8.0.md'
      - 'docs/releases/v1.8.1.md'
      - 'docs/releases/v1.9.0.md'
      - 'docs/releases/v2.0.0.md'
      - 'docs/governance/**'
      - 'docs/operations/**'
      - 'README.md'
      - '.github/workflows/resource-library-pages.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the verified build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: a9-field-desk-pages-${{ github.ref }}
  # New PR revisions supersede obsolete preview QA; production/scheduled publication stays serialized.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check site/app.js
      - run: node --check site/projects.js
      - run: node --check site/legacy-route.js
      - run: node --check scripts/browser_qa.cjs
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate synthetic public artifact
        run: |
          python scripts/build_browser_fixture.py _preview
          python scripts/validate_public_artifact.py --site _preview

  browser-qa:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Use system Chrome where available, otherwise install Playwright Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo 'PLAYWRIGHT_USE_SYSTEM_CHROME=1' >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Render synthetic, no-credentials browser site
        run: python scripts/build_browser_fixture.py _preview
      - name: Chromium desktop and mobile navigation / links / overflow QA
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory _preview >/tmp/fielddesk-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/catalog.json -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser_qa.cjs

  project:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.test.result == 'success' &&
      (needs['browser-qa'].result == 'success' || (github.event_name == 'schedule' && needs['browser-qa'].result == 'skipped')) &&
      (github.event_name == 'workflow_dispatch' || vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER != '')
    needs: [test, browser-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check existing Google WIF variables
        env:
          WIF_PROVIDER: ${{ vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Existing Google WIF provider and service-account variables are required."
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.JP_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read authoritative Google Sheet and build reviewed directory
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/publish_library.py --output _site
      - name: Check published counts, origins, URLs, exclusions and access notes
        run: python scripts/validate_public_artifact.py --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Explicit status function disables GitHub's implicit success() over the
    # entire dependency chain. browser-qa is intentionally skipped on schedule.
    # Require an actual successful validated project build before deployment.
    if: >-
      !cancelled() &&
      needs.project.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  release-cutover:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify canonical Pages links and publish v1.3.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.3.2.md'
          tag='v1.3.2'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js editing.html operations.html resources/project-documents.html; do
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$pages/$file?release=$GITHUB_SHA" | cmp - "site/$file"
          done
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$pages/catalog.json?release=$GITHUB_SHA" > /tmp/catalog-live.json
          python -c 'import json; j=json.load(open("/tmp/catalog-live.json")); assert j["schema_version"]=="2.0.0" and len(j["companies"])>=1 and j["source_manifest"]["private_payroll_connected"] is False'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library v1.3.2 — Publication Status QA' --notes-file "$notes"
          fi

  release-astam-v1-4:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify Astam Library ownership and tag v1.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.4.0.md'
          tag='v1.4.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo "No new Astam ownership milestone in this push"
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in feasibility/index.html feasibility/buyer-guide/index.html \
            feasibility/buyer-guide/guide.json \
            ops/data/land-feasibility/astam-village-public.v1.0.json \
            ops/data/land-feasibility/astam-buyer-guide-public.v1.0.json \
            assets/css/jp-theme-tokens.css assets/css/site-shell.css \
            assets/css/jp-botanical.css; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" \
              | cmp - "site/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/catalog.json?commit=$GITHUB_SHA" \
            | python -c 'import json,sys; x=json.load(sys.stdin); assert x["schema_version"]=="2.0.0" and x["source_manifest"]["private_payroll_connected"] is False'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library Astam Resources v1.4.0' --notes-file "$notes"
          fi

  release-workspaces-v1-5:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify normalized slots, workspaces and tag v1.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.5.0.md'
          tag='v1.5.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js styles.css workspaces.html money.html money.js portal.css \
            editing.html operations.html resources/project-documents.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" | cmp - "site/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/catalog.json?commit=$GITHUB_SHA" | \
            python -c 'import json,sys; x=json.load(sys.stdin); assert x["schema_version"]=="2.0.0"; assert x["source_manifest"]["private_payroll_connected"] is False; assert all("original_filename" in r for r in x["resources"])'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library v1.5.0 — Normalized Slots and Money Routing' --notes-file "$notes"
          fi

  release-desk-field-v1-6:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify Desk Field separation and tag v1.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.6.0.md'
          tag='v1.6.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html field.html workspaces.html money.html operations.html \
            editing.html portal.css app.js resources/project-documents.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" | cmp - "site/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/catalog.json?commit=$GITHUB_SHA" | \
            python -c 'import json,sys; x=json.load(sys.stdin); assert x["schema_version"]=="2.0.0"; assert x["source_manifest"]["private_payroll_connected"] is False'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library v1.6.0 — Two Primary Resource Tabs' --notes-file "$notes"
          fi

  release-clean-payment-v1-7:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify clean Payment Pages projection and tag v1.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.7.0.md'
          tag='v1.7.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in field.html field-payments.js money.html portal.css index.html \
            workspaces.html editing.html operations.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" | cmp - "site/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/field-payments.json?commit=$GITHUB_SHA" > /tmp/field-payments-live.json
          python -c 'import json; d=json.load(open("/tmp/field-payments-live.json")); assert d["schema_version"]=="1.0.0"; assert d["count"]==958; assert d["worker_count"]==21; assert len(d["records"])==958; assert round(d["total_npr"],2)==3162016.38; assert d["source"]["worker_money_goods_transaction_feed"] is False'
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/catalog.json?commit=$GITHUB_SHA" | \
            python -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"]=="2.0.0"; assert d["source_manifest"]["private_payroll_connected"] is False'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library v1.7.0 — Source-derived Historical Payments' --notes-file "$notes"
          fi

  scheduled-refresh-assert:
    # Prevent a green 'schedule' run if the validated build succeeded but
    # Pages deployment was skipped. Status function tolerates skipped QA.
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs: [project, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require scheduled verified build AND Pages deployment success
        env:
          BUILD_RESULT: ${{ needs.project.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          test "$BUILD_RESULT" = 'success'
          test "$DEPLOY_RESULT" = 'success'

  release-scheduled-refresh-v1-7-1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify served v1.7.1 pages, payment source and release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.7.1.md'
          tag='v1.7.1'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in field.html money.html editing.html operations.html index.html \
            field-payments.js portal.css; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" | cmp - "site/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/field-payments.json?commit=$GITHUB_SHA" | \
            python -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"]=="1.0.0"; assert d["count"]==958; assert len(d["records"])==958; assert d["source"]["worker_money_goods_transaction_feed"] is False'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library v1.7.1 — Scheduled Refresh & Source Folders' --notes-file "$notes"
          fi

  release-staff-sheets-v1-8:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify published Sheets page and tag v1.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.8.0.md'
          tag='v1.8.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in memory-wall/index.html memory-wall/sheets.css \
            memory-wall/sheets.js index.html field.html workspaces.html \
            operations.html editing.html money.html resources/project-documents.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" \
              | cmp - "site/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors \
            "$pages/memory-wall/index.html?commit=$GITHUB_SHA" | \
            python -c 'import re,sys; s=sys.stdin.read(); x=re.findall("https://docs[.]google[.]com/spreadsheets/d/[A-Za-z0-9_-]+/edit",s); assert len(x)==35 and len(set(x))==35'
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/field-payments.json?commit=$GITHUB_SHA" | \
            python -c 'import json,sys; d=json.load(sys.stdin); assert d["count"]==958 and d["source"]["worker_money_goods_transaction_feed"] is False'
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/catalog.json?commit=$GITHUB_SHA" | \
            python -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"]=="2.0.0"; assert d["source_manifest"]["private_payroll_connected"] is False'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library v1.8.0 — Google Sheets for Staff' --notes-file "$notes"
          fi

  release-desk-source-v1-8-1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify Desk catalogue from live Pages and tag v1.8.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v1.8.1.md'
          tag='v1.8.1'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js editing.html resources/project-documents.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?revision=$GITHUB_SHA" | cmp - "site/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/catalog.json?revision=$GITHUB_SHA" > /tmp/desk-catalog-live.json
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/document-packets.json?revision=$GITHUB_SHA" > /tmp/desk-packets-live.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/desk-catalog-live.json'))
          p=json.load(open('/tmp/desk-packets-live.json'))
          resources=c['resources']
          docs=p['documents']
          assert len(c['companies'])==2 and len(c['projects'])==9
          assert len(resources)==68, 'Expected 46 prior plus 22 new references'
          assert len(docs)==6 and len({d['document_id'] for d in docs})==6
          new=[r for r in resources if '20261114' in r['id']]
          assert len(new)==22 and len({r['id'] for r in new})==22
          assert all(r['approval']=='UNVERIFIED_AS_CURRENT_ISSUE' for r in new)
          assert all(r['access']=='DRIVE_PERMISSION_REQUIRED' for r in new)
          b=[r for r in new if r['project_id']=='PRJ-000029']
          assert len(b)==3 and len({r['url'] for r in b})==1
          assert {r['group'] for r in b}=={'drawings','reports'}
          assert all(d['project_id']=='PRJ-000029' for d in docs)
          assert c['source_manifest']['private_payroll_connected'] is False
          print('Desk release verified: 68 resource references, 22 new, six existing packets.')
          PY
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Field & Desk Library v1.8.1 — Desk Source Reconciliation' --notes-file "$notes"
          fi


  release-resource-ux-v1-9:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify v1.9.0 public UI and finance ownership, then tag exact main
        env:
